<title>Proto app Piano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout : un téléphone centré, 5 onglets, écrans empilés avec retour, feuilles modales en bas */
:root{
  --page:#E9ECEA; --screen:#FBFCFB; --ink:#1B2421; --muted:#68746F; --line:#DCE2DF;
  --felt:#2E5E4E; --felt-soft:#E1ECE7; --key:#FFFFFF; --ebony:#1E2522; --frame:#1A1F1D; --scrim:rgba(20,28,25,.45);
  --serif:"Instrument Serif",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0F1312; --screen:#161B19; --ink:#E7ECE9; --muted:#93A09A; --line:#2A3330;
  --felt:#7DBBA4; --felt-soft:#1F2D28; --key:#212826; --ebony:#E7ECE9; --frame:#000; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0F1312; --screen:#161B19; --ink:#E7ECE9; --muted:#93A09A; --line:#2A3330;
  --felt:#7DBBA4; --felt-soft:#1F2D28; --key:#212826; --ebony:#E7ECE9; --frame:#000; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;justify-content:center;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.phone{width:390px;max-width:100%;height:min(800px,calc(100vh - 48px));background:var(--screen);border:10px solid var(--frame);
  border-radius:46px;overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px){body{padding:0}.phone{border:0;border-radius:0;height:100%;width:100%}}
.status{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.head{padding:6px 20px 10px;display:flex;align-items:flex-end;gap:10px}
.head .back{width:40px;height:40px;margin-left:-10px;border-radius:50%;display:grid;place-items:center;flex:none}
.head h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0;line-height:1.1;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scroll{flex:1;overflow-y:auto;padding:0 20px 24px;min-height:0}
/* bandeau chrono */
.band{margin:0 20px 10px;display:flex;align-items:center;gap:10px;background:var(--felt);color:var(--screen);border-radius:14px;padding:8px 8px 8px 14px;font-size:13px;cursor:pointer}
.band span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band b{font-variant-numeric:tabular-nums}
.band button{width:36px;height:36px;border-radius:50%;background:var(--screen);color:var(--felt);display:grid;place-items:center;flex:none}
/* éléments communs */
.card{border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:12px}
.v{font-variant-numeric:tabular-nums;font-weight:600}
.lbl{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:600}
.fact{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.link{color:var(--felt);font-weight:600;font-size:14px;padding:10px 0;text-align:left}
.dur-in{width:76px;text-align:right;padding:8px 10px;border-radius:10px;border:0;background:var(--felt-soft);color:var(--felt);font-weight:700;font-variant-numeric:tabular-nums}
.dur-in::placeholder{color:var(--felt);opacity:.6}
.txt{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--screen)}
textarea.txt{resize:vertical;min-height:44px;font-size:14px}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--screen);font-weight:700}
.primary:disabled{opacity:.35;cursor:default}
.secondary{width:100%;padding:14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.danger{color:#A2463A;border-color:currentColor}
.crumb{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--felt);flex:none}
.check div{flex:1;min-width:0}
.group{font-weight:700;font-size:14px;margin:16px 0 2px}
.sect{font-size:12px;color:var(--muted);margin-top:8px}
/* session */
.start{width:100%;aspect-ratio:2.2;max-width:100%;border-radius:22px;background:var(--felt);color:var(--screen);font-family:var(--serif);font-size:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;margin:6px 0 4px}
.start small{font-family:var(--sans);font-size:13px;opacity:.8}
.total{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.total strong{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.total small{color:var(--muted)}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
.task .t{flex:1;min-width:0}
.task .name{font-weight:600;margin-top:2px}
.task .dur{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.task.on .dur{color:var(--felt)}
.task.on::before{content:"";position:absolute;left:-20px;top:12px;bottom:12px;width:3px;background:var(--felt);border-radius:0 3px 3px 0}
.play{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.task.on .play{background:var(--felt);border-color:var(--felt);color:var(--screen)}
/* semaine */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.nav button.arrow:disabled{opacity:.3}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.k{background:var(--key);border:1px solid var(--line);border-radius:0 0 10px 10px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font-size:12px;gap:2px;position:relative}
.k b{font-size:15px}
.k i{font-style:normal;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.k.today::after{content:"";position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:var(--felt)}
.k[aria-pressed="true"]{background:var(--ebony);color:var(--screen);border-color:var(--ebony)}
.k[aria-pressed="true"] i{color:inherit;opacity:.7}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.plan>div{flex:1;min-width:0}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted);flex:none}
/* projets */
.pcard{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:block}
.pcard strong{font-size:17px;display:block}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.trow span{flex:1;min-width:0}
.mini{font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-radius:8px}
.mini.go{color:var(--felt)}
.archived{color:var(--muted);text-decoration:line-through}
details.arch summary{font-size:13px;color:var(--muted);padding:8px 0;cursor:pointer}
/* planning */
.grid-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.grid{border-collapse:separate;border-spacing:3px;font-size:12px}
.grid th{font-weight:600;color:var(--muted);text-align:center;min-width:46px;padding:4px 0}
.grid th.cur{color:var(--felt)}
.grid td.name{position:sticky;left:0;background:var(--screen);padding-right:8px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.grid td.kind{color:var(--muted);font-size:11px;padding-right:6px;white-space:nowrap}
.cell{width:46px;height:28px;border-radius:7px;border:1px solid var(--line);display:block}
.cell.ini{background:var(--line);border-color:var(--line)}
.cell.rev{background:var(--felt);border-color:var(--felt)}
.cell.fixed{cursor:default}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tag{font-size:11px;font-weight:700;color:var(--felt);background:var(--felt-soft);padding:2px 7px;border-radius:99px;margin-left:6px}
/* bilan */
.recap{font-variant-numeric:tabular-nums;line-height:1.5}
.recap h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:20px 0 4px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.line span:last-child{color:var(--muted);text-align:right}
.big{font-size:17px;font-weight:600}
.recap details{border-top:1px solid var(--line);padding:8px 0}
.recap summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.recap summary::-webkit-details-marker{display:none}
.sub{padding-left:14px;font-size:13px;color:var(--muted);padding-top:4px}
.sub .line span:first-child{color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.5}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--felt);margin-right:6px;vertical-align:middle}
/* groupes par projet, tableau de bord */
:root{--over:#d03b3b;--over-soft:#FBE4E2;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--over-soft:#3A1F1E;--c0:#3987e5;--c1:#d95926;--c2:#199e70}}
:root[data-theme="dark"]{--over-soft:#3A1F1E;--c0:#3987e5;--c1:#d95926;--c2:#199e70}
.pg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:16px 0 0}
.pg i{width:10px;height:10px;border-radius:3px;flex:none}
.pg+.task,.pg+.plan{border-top:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.tile{background:var(--felt-soft);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile small{font-size:11px;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--felt);border-radius:4px}
.prog.over i{background:var(--ink)}
.panel{border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px}
.panel h3{margin:0 0 2px;font-size:15px}
.panel .fact{margin:0 0 8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.chart .hl{fill:var(--ink);font-weight:700}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--felt)}
.chart .bud{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.dummy,.chart .hit:focus{outline:none}
.tip{font-size:13px;min-height:20px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend2 i{display:inline-block;width:12px;height:10px;border-radius:3px;background:var(--felt);margin-right:5px;vertical-align:middle}
.legend2 i.l{height:2px;background:var(--ink);border-radius:1px}
.legend2 i.o{background:none;border:1.5px solid var(--muted)}
.hb{padding:10px 0;border-top:1px solid var(--line)}
.hb:first-of-type{border-top:0}
.hb summary{list-style:none;cursor:pointer}
.hb summary::-webkit-details-marker{display:none}
.hb .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.hb .top b{font-weight:700}
.hb .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;position:relative;border-radius:4px;background:var(--felt-soft)}
.track .pv{position:absolute;top:-2px;bottom:-2px;left:0;border:1.5px solid var(--muted);border-radius:5px}
.track .rl{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.hb .sub{padding-top:8px}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.pchip i{width:8px;height:8px;border-radius:2px}
.drow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow>button{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.drow .dn{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.drow .dn small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.drow.today .dn span::after{content:" · aujourd'hui";color:var(--felt);font-weight:600;font-size:12px}
.chart .gb{fill:var(--felt-soft);stroke:var(--felt);stroke-width:1;stroke-dasharray:3 2}
.chart .exc{fill:var(--ink)}
.chart g.off{opacity:.45}
.tipbox{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--felt-soft);border-radius:12px;padding:8px 12px;margin:8px 0 6px;font-size:13px;font-variant-numeric:tabular-nums}
.tipbox b{width:100%;font-size:13px}
.tipbox strong{font-size:16px}
.tipbox em{font-style:normal;color:var(--muted);font-size:12px}
.legend2 i.g{background:var(--felt-soft);border:1px dashed var(--felt)}
.legend2 i.e{background:var(--ink)}
.over{color:var(--over);font-weight:700}
.split{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;margin:4px 0 6px}
.split span{height:100%}
.splitleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.splitleg i,.pn i,.pl-p i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.splitleg b{color:var(--ink);font-variant-numeric:tabular-nums}
.prj{padding:14px 0 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prj-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-size:15px;min-width:0}
.pv{white-space:nowrap;font-variant-numeric:tabular-nums}
.pv strong{font-size:20px}
.pv small{color:var(--muted);font-size:12px}
.secs{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;align-items:center;gap:10px;font-size:13px}
.srow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.sb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.tk summary{font-size:13px;color:var(--felt);font-weight:600;cursor:pointer;padding:4px 0}
.tk .line{padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.pl-p{font-size:12px;color:var(--muted);margin:10px 0 6px}
.pl-p:first-of-type{margin-top:6px}
.dur-in.tot{display:inline-block;flex:none}
.dur-in.tot.bad{background:var(--over-soft);color:var(--over);box-shadow:inset 0 0 0 1.5px var(--over)}
/* plus */
.menu button{width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.menu button:disabled{color:var(--muted);cursor:default}
/* onglets */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 4px 14px;background:var(--screen)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;min-height:48px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--felt);font-weight:700}
/* feuille */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--screen);width:100%;max-height:86%;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet header{padding:10px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.sheet header h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0}
.sheet .body{overflow-y:auto;padding:0 20px 8px;min-height:0}
.sheet footer{padding:10px 20px 20px;display:flex;gap:10px}
.sheet footer button{flex:1}
.ghost{padding:15px;border-radius:14px;border:1px solid var(--line);font-weight:700}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--screen);padding:10px 16px;border-radius:12px;font-size:13px;white-space:nowrap;z-index:6}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>

<div class="phone" id="phone">
  <div class="status"><span id="clock"></span><span>82 %</span></div>
  <header class="head" id="head"></header>
  <div class="band" id="band" hidden></div>
  <main class="scroll" id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div id="sheetHost"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* ===== utilitaires ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const DN=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."],DL=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],MN=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const W=["2026-11-02","2026-11-09","2026-11-16","2026-11-23","2026-11-30","2026-12-07"];
const CUR=1, TODAY="2026-11-09";
const dt=s=>new Date(s+"T12:00");
const days=wi=>[...Array(7)].map((_,i)=>{const d=dt(W[wi]);d.setDate(d.getDate()+i);return iso(d)});
const dShort=s=>{const d=dt(s);return DN[d.getDay()]+" "+d.getDate()};
const dLong=s=>{const d=dt(s);return DN[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]};
const wLab=wi=>{const d=dt(W[wi]);return "Semaine du "+d.getDate()+" "+MN[d.getMonth()]};
const wShort=wi=>{const d=dt(W[wi]);return d.getDate()+" "+MN[d.getMonth()].replace(".","")};
const fm=s=>s==null?"—":Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60));
const fs=s=>{s=Math.floor(s);return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
const parse=v=>{v=String(v).trim().toLowerCase();if(!v)return null;let m=v.match(/^(\d+)\s*[:h]\s*(\d{0,2})$/);if(m)return(+m[1])*3600+(+(m[2]||0))*60;m=v.match(/^(\d+)$/);return m?(+m[1])*60:undefined};
const sum=a=>a.reduce((t,v)=>v==null?t:(t||0)+v,null);
const gap=(real,ref,word)=>{if(real==null||ref==null)return"";const d=real-ref;if(Math.abs(d)<60)return"pile dans le "+word;return fm(Math.abs(d))+(d>0?" au-dessus du ":" sous le ")+word};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let uid=100;const nid=p=>p+(uid++);

/* ===== données fictives ===== */
const D={

  let g="";for(let h=0;h<=max/3600;h+=step){g+=`<line class="grid-l" x1="${L}" x2="${Wd}" y1="${y(h*3600)}" y2="${y(h*3600)}"/><text x="${L-6}" y="${y(h*3600)+3}" text-anchor="end">${h}h</text>`}
  cols.forEach((c,i)=>{const x=L+cw*i+cw/2-bw/2,r=c.r||0,b=c.b;
    let m="";
    if(b!=null&&b>0)m+=top4(x,y(b),bw,B-y(b),"gb");
    if(r>0){const inB=b!=null?Math.min(r,b):r;
      if(b!=null&&r>b){m+=`<rect class="bar" x="${x}" y="${y(inB)}" width="${bw}" height="${B-y(inB)}"/>`+top4(x,y(r),bw,Math.max(0,y(inB)-y(r)-2),"exc")}
      else m+=top4(x,y(inB),bw,B-y(inB),"bar")}
    g+=`<g class="${i===sel?"on":"off"}">${m}</g>`;
    if(i===sel&&(c.r!=null))g+=`<text x="${x+bw/2}" y="${y(Math.max(r,b||0))-5}" text-anchor="middle" class="hl">${fm(c.r)}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="${i===sel?"hl":""}">${c.lab}</text>`;
    g+=`<rect class="hit" x="${L+cw*i}" y="0" width="${cw}" height="${H}" tabindex="0" role="button" aria-label="${esc(c.full)}" data-act="tip" data-chart="${id}" data-i="${i}"/>`});
  const c=cols[sel],gp=gap(c.r,c.b,word);
  return`<div class="chart"><div class="tipbox"><b>${c.full}</b><span>Réel <strong>${fm(c.r)}</strong> · ${word==="budget"?"Budget":"Prévu"} <strong>${fm(c.b)}</strong></span>${gp?`<em>${gp}</em>`:`<em>${c.b==null?(word==="budget"?"Budget non saisi":"Pas de temps prévu"):""}</em>`}</div>
    <svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Réel et ${word} par colonne">${g}</svg>
    <div class="legend2"><span><i></i>Réel</span><span><i class="g"></i>${word==="budget"?"Budget":"Prévu"}</span><span><i class="e"></i>Au-dessus du ${word}</span></div></div>`;
}

function render(){
  const v=cur(),r=V[v.v](v);
  document.getElementById("head").innerHTML=`${stack.length>1?`<button class="back" data-act="back" aria-label="Retour">${BACK}</button>`:""}<div><h1>${esc(r.t)}</h1>${r.s?`<p>${esc(r.s)}</p>`:""}</div>`;
  document.getElementById("view").innerHTML=r.h;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" data-act="tab" data-v="${k}" ${stack[0].v===k?'aria-current="page"':""}>${ICON[k]}${l}</button>`).join("");
  const host=document.getElementById("sheetHost");
  if(sheet){const s=SH[sheet.s](sheet);host.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(s.t)}"><header><h2>${s.t}</h2><button class="x" data-act="close" aria-label="Fermer">✕</button></header><div class="body">${s.h}</div><footer><button class="ghost" data-act="close">Annuler</button><button class="primary" data-act="${s.act}">${s.ok}</button></footer></div></div>`}else host.innerHTML="";
  tick();
}
function tick(){
  const d=new Date();document.getElementById("clock").textContent=d.getHours()+":"+pad(d.getMinutes());
  const L=D.live,band=document.getElementById("band");
  band.hidden=!L||(stack.length===1&&stack[0].v==="session");
  if(L){
    document.querySelectorAll("[data-live]").forEach(e=>e.textContent=fs(ldur(L.items[e.dataset.live])));
    const st=document.getElementById("sessTotal");if(st)st.textContent=fs(sum(L.items.map(ldur))||0);
    if(!band.hidden){const it=L.run!=null?L.items[L.run]:null;
      band.innerHTML=it?`<span>● ${esc(T(it.tid).label)}</span><b>${fs(ldur(it))}</b><button data-act="bandToggle" aria-label="Pause">${PAUSE}</button>`:`<span>Session en cours · en pause</span><button data-act="bandToggle" aria-label="Reprendre">${PLAY}</button>`}
  }
}
function toggle(i){const L=D.live;if(L.run!=null){const it=L.items[L.run];it.acc=ldur(it);it.start=null}
  L.run=L.run===i?null:i;if(L.run!=null){L.items[L.run].start=Date.now();L.last=L.run}render()}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
const checked=()=>[...document.querySelectorAll(".sheet input[type=checkbox]:checked")].map(c=>c.value);

const A={
 tab:e=>go(e.dataset.v), back:()=>back(), push:e=>push({v:e.dataset.v,id:e.dataset.id,day:e.dataset.day}),
 sheet:e=>{sheet={s:e.dataset.s,day:e.dataset.day,id:e.dataset.id};render()},
 close:(e,ev)=>{if(ev.target===e){sheet=null;render()}},
 toggle:e=>toggle(+e.dataset.i),
 bandToggle:()=>toggle(D.live.run!=null?D.live.run:(D.live.last??0)),
 startSession:()=>{const d=new Date();D.live={at:d.getHours()+":"+pad(d.getMinutes()),run:null,items:[]};sheet={s:"addTasks"};render()},
 confirmAdd:()=>{const ids=checked(),inS=new Set(D.live.items.map(i=>i.tid));
   D.live.items=D.live.items.filter(i=>ids.includes(i.tid)||ldur(i)>0);
   ids.forEach(id=>{if(!inS.has(id))D.live.items.push({tid:id,acc:0,start:null})});
   const sec=document.getElementById("nSec").value,lab=document.getElementById("nLab").value.trim();
   if(lab&&!sec){toast("Choisis une section pour la nouvelle tâche");return}
   if(lab){const t={id:nid("t"),sid:sec,label:lab,arch:false};D.tasks.push(t);D.live.items.push({tid:t.id,acc:0,start:null})}
   if(D.live.run!=null&&D.live.run>=D.live.items.length)D.live.run=null;sheet=null;render()},
 confirmEnd:()=>{const L=D.live;if(L.run!=null)toggle(L.run);
   if(L.items.length)D.sessions.push({id:nid("x"),day:TODAY,at:L.at,items:L.items.map(i=>({tid:i.tid,sec:Math.round(i.acc),corr:null}))});
   D.live=null;sheet=null;render();toast("Session enregistrée")},
 week:e=>{const v=cur();v.wi=(v.wi??CUR)+ +e.dataset.d;v.sel=0;render()},
 day:e=>{stack[stack.length-1]={v:"jour",day:e.dataset.day};render()},
 tip:e=>{cur()["sel_"+e.dataset.chart]=+e.dataset.i;const v=document.getElementById("view"),y=v.scrollTop;render();v.scrollTop=y},
 unplan:e=>{delete D.tplans[e.dataset.k];render()},
 confirmPlan:()=>{const ids=checked(),day=sheet.day;
   Object.keys(D.tplans).filter(k=>k.endsWith("|"+day)&&!ids.includes(k.split("|")[0])&&!T(k.split("|")[0]).arch).forEach(k=>delete D.tplans[k]);
   ids.forEach(id=>{const k=id+"|"+day;if(!(k in D.tplans))D.tplans[k]=null});sheet=null;render()},
 archSel:()=>{const ids=[...document.querySelectorAll("[data-arch]:checked")].map(c=>c.dataset.arch);ids.forEach(id=>T(id).arch=true);render();toast(ids.length+" tâche"+(ids.length>1?"s archivées":" archivée"))},
 archive:e=>{const t=T(e.dataset.id);t.arch=true;render();toast("Tâche archivée")},
 reactivate:e=>{T(e.dataset.id).arch=false;render();toast("Tâche réactivée")},
 confirmDel:()=>{P(sheet.id).deleted=true;sheet=null;stack=[{v:"projets"}];render();toast("Projet supprimé")},
 confirmProject:()=>{const n=document.getElementById("npN").value.trim(),s=document.getElementById("npS").value||null,en=document.getElementById("npE").value||null,err=document.getElementById("npErr");
   if(!n){err.textContent="Donne un nom au projet.";return}if(s&&en&&en<s){err.textContent="La date de fin doit être après la date de début.";return}
   const p={id:nid("p"),name:n,start:s,end:en,deleted:false};D.projects.push(p);sheet=null;stack=[{v:"projets"},{v:"projet",id:p.id}];render()},
 cell:e=>{const s=S(e.dataset.sid),wi=+e.dataset.wi;
   if(!s.ini.length){s.ini=[wi];s.rev=[wi];toast("Premier placement gardé comme prévu initial")}
   else s.rev=s.rev.includes(wi)?s.rev.filter(x=>x!==wi):[...s.rev,wi].sort((a,b)=>a-b);render()},
 bweek:e=>{const v=cur();v.wi=(v.wi??CUR)+ +e.dataset.d;render()},
 uncorr:e=>{const[sid,n]=e.dataset.k.split("|");D.sessions.find(s=>s.id===sid).items[n].corr=null;render()},
 addManual:()=>{const t=document.getElementById("mTask").value,d=document.getElementById("mDay").value,s=parse(document.getElementById("mDur").value);
   if(!t){toast("Choisis une tâche");return}if(!s){toast("Indique une durée, par exemple 45 ou 1:30");return}
   D.manual.unshift({id:nid("m"),tid:t,day:d,sec:s});manualSel=null;render();toast("Ajout manuel enregistré")},
 delManual:e=>{D.manual=D.manual.filter(m=>m.id!==e.dataset.id);render()},
 toast:e=>toast(e.dataset.m),
 confirmRestore:()=>{sheet=null;render();toast("Sauvegarde restaurée")}
};
document.getElementById("phone").addEventListener("click",ev=>{const e=ev.target.closest("[data-act]");if(!e||!A[e.dataset.act])return;
  if(e.dataset.act!=="close")ev.stopPropagation();A[e.dataset.act](e,ev)});
document.getElementById("band").addEventListener("click",ev=>{if(!ev.target.closest("button"))go("session")});
document.getElementById("phone").addEventListener("change",ev=>{const e=ev.target,ds=e.dataset;
  const dur=()=>{const v=parse(e.value);if(v===undefined){toast("Durée non comprise : écris 45 ou 1:30");return undefined}return v};
  if(ds.budget!=null){const v=dur();if(v===undefined)return;if(v==null)delete D.budgets[ds.budget];else D.budgets[ds.budget]=v;render()}
  else if(ds.tplan!=null){const v=dur();if(v===undefined)return;D.tplans[ds.tplan]=v;render()}
  else if(ds.pplan!=null){const v=dur();if(v===undefined)return;if(v==null)delete D.pplans[ds.pplan];else D.pplans[ds.pplan]=v;render()}
  else if(ds.prog!=null){S(ds.prog).progress=e.value.trim()||null}
  else if(ds.corr!=null){const v=dur();if(v===undefined||v==null)return;const[sid,n]=ds.corr.split("|");const it=D.sessions.find(s=>s.id===sid).items[n];if(v!==it.sec)it.corr=v;render();toast("Durée corrigée")}
  else if(ds.arch!=null){const n=document.querySelectorAll("[data-arch]:checked").length,b=document.getElementById("archBtn");b.disabled=!n;b.textContent="Archiver la sélection ("+n+")"}
  else if(e.id==="mTask")manualSel=e.value||null;
});
document.getElementById("phone").addEventListener("keydown",ev=>{const e=ev.target;if(ev.key!=="Enter"||!e.value||!e.value.trim())return;
  if(e.dataset.newtask){D.tasks.push({id:nid("t"),sid:e.dataset.newtask,label:e.value.trim(),arch:false});render();const n=document.querySelector(`[data-newtask="${e.dataset.newtask}"]`);n&&n.focus()}
  else if(e.dataset.newsection){const pid=e.dataset.newsection;D.sections.push({id:nid("s"),pid,name:e.value.trim(),progress:null,ini:[],rev:[]});render()}});
document.getElementById("phone").addEventListener("toggle",ev=>{const p=ev.target.dataset&&ev.target.dataset.pid;if(p){ev.target.open?openP.add(p):openP.delete(p)}},true);

let tk=0;
render();
setInterval(()=>{tick();const v=cur();if(++tk%5===0&&v.v==="bilan"&&D.live&&D.live.run!=null&&!sheet&&!document.activeElement.matches("input,textarea,select")){const y=document.getElementById("view").scrollTop;render();document.getElementById("view").scrollTop=y}},1000);
</script>
